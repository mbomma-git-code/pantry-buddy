# Deploy PantryBuddy AWS infrastructure via CDK.
# Requires: GitHub repo variables AWS_CDK_DEPLOY_ROLE_ARN and AWS_ACCOUNT_ID.
name: Deploy Infrastructure (CDK)

on:
  push:
    branches:
      - main
    paths:
      - 'infrastructure/**'
      - 'backend/**'
      - 'frontend/**'
      - 'data/recipes_json/**'
      - 'data/kb/**'
      - 'tools/build_kb_index.py'
      - 'tools/sync_kb_index.py'
      - '.github/workflows/deploy-infrastructure.yml'
  workflow_dispatch:

env:
  AWS_REGION: us-east-2

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: infrastructure/package-lock.json

      - name: Install dependencies
        working-directory: infrastructure
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Build Knowledge Base structured corpus
        run: python3 tools/build_kb_index.py --input data/recipes_json/recipes.json --output-dir data/kb

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_CDK_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # - name: CDK bootstrap
      #   working-directory: infrastructure
      #   run: npx cdk bootstrap --require-approval never
      #   env:
      #     CDK_DEFAULT_ACCOUNT: ${{ vars.AWS_ACCOUNT_ID }}
      #     CDK_DEFAULT_REGION: ${{ env.AWS_REGION }}

      - name: CDK deploy
        working-directory: infrastructure
        run: npx cdk deploy --require-approval never --all
        env:
          CDK_DEFAULT_ACCOUNT: ${{ vars.AWS_ACCOUNT_ID }}
          CDK_DEFAULT_REGION: ${{ env.AWS_REGION }}

      - name: Sync KB corpus and start ingestion
        run: |
          set -e
          python3 -m pip install --quiet boto3
          REGION="${{ env.AWS_REGION }}"
          STACK="PantryBuddyStack"
          DATA_BUCKET=$(aws cloudformation describe-stacks --stack-name "$STACK" --region "$REGION" --query "Stacks[0].Outputs[?OutputKey=='DataBucketName'].OutputValue" --output text)
          KB_ID=$(aws cloudformation describe-stacks --stack-name "$STACK" --region "$REGION" --query "Stacks[0].Outputs[?OutputKey=='KnowledgeBaseId'].OutputValue" --output text)
          DS_ID=$(aws cloudformation describe-stacks --stack-name "$STACK" --region "$REGION" --query "Stacks[0].Outputs[?OutputKey=='KnowledgeBaseDataSourceId'].OutputValue" --output text)
          if [[ -z "$DATA_BUCKET" || "$DATA_BUCKET" == "None" ]]; then
            echo "DataBucketName output not found; skipping KB sync"
            exit 0
          fi
          if [[ -z "$KB_ID" || "$KB_ID" == "None" || -z "$DS_ID" || "$DS_ID" == "None" ]]; then
            echo "Knowledge Base outputs not ready; uploading structured corpus only"
            python3 tools/sync_kb_index.py --bucket "$DATA_BUCKET" --region "$REGION" --skip-ingest
            exit 0
          fi
          python3 tools/sync_kb_index.py \
            --bucket "$DATA_BUCKET" \
            --region "$REGION" \
            --knowledge-base-id "$KB_ID" \
            --data-source-id "$DS_ID"

      - name: Deploy frontend to stack website bucket
        run: |
          set -e
          REGION="${{ env.AWS_REGION }}"
          STACK="PantryBuddyStack"
          WEBSITE_BUCKET=$(aws cloudformation describe-stacks --stack-name "$STACK" --region "$REGION" --query "Stacks[0].Outputs[?OutputKey=='WebsiteBucketName'].OutputValue" --output text)
          if [[ -z "$WEBSITE_BUCKET" || "$WEBSITE_BUCKET" == "None" ]]; then
            echo "WebsiteBucketName output not found for stack $STACK"
            exit 1
          fi
          echo "Deploying frontend/src/ to s3://$WEBSITE_BUCKET"
          aws s3 sync frontend/src/ "s3://$WEBSITE_BUCKET/" --delete --region "$REGION"
          echo "Frontend deployment complete."

      - name: Verify AWS resources
        run: |
          set -e
          REGION="${{ env.AWS_REGION }}"
          STACK="PantryBuddyStack"

          echo "=== 1. CloudFormation stack ==="
          STATUS=$(aws cloudformation describe-stacks --stack-name "$STACK" --region "$REGION" --query 'Stacks[0].StackStatus' --output text)
          if [[ "$STATUS" != "CREATE_COMPLETE" && "$STATUS" != "UPDATE_COMPLETE" ]]; then
            echo "Unexpected stack status: $STATUS"
            exit 1
          fi
          echo "Stack $STACK status: $STATUS"

          echo "=== 2. Stack outputs (S3, API, KB) ==="
          WEBSITE_BUCKET=$(aws cloudformation describe-stacks --stack-name "$STACK" --region "$REGION" --query "Stacks[0].Outputs[?OutputKey=='WebsiteBucketName'].OutputValue" --output text)
          DATA_BUCKET=$(aws cloudformation describe-stacks --stack-name "$STACK" --region "$REGION" --query "Stacks[0].Outputs[?OutputKey=='DataBucketName'].OutputValue" --output text)
          API_ENDPOINT=$(aws cloudformation describe-stacks --stack-name "$STACK" --region "$REGION" --query "Stacks[0].Outputs[?OutputKey=='ApiEndpoint'].OutputValue" --output text)
          KB_ID=$(aws cloudformation describe-stacks --stack-name "$STACK" --region "$REGION" --query "Stacks[0].Outputs[?OutputKey=='KnowledgeBaseId'].OutputValue" --output text)
          DS_ID=$(aws cloudformation describe-stacks --stack-name "$STACK" --region "$REGION" --query "Stacks[0].Outputs[?OutputKey=='KnowledgeBaseDataSourceId'].OutputValue" --output text)
          echo "WebsiteBucketName: $WEBSITE_BUCKET"
          echo "DataBucketName: $DATA_BUCKET"
          echo "ApiEndpoint: $API_ENDPOINT"
          echo "KnowledgeBaseId: $KB_ID"
          echo "KnowledgeBaseDataSourceId: $DS_ID"
          if [[ -z "$KB_ID" || "$KB_ID" == "None" || -z "$DS_ID" || "$DS_ID" == "None" ]]; then
            echo "Knowledge Base outputs missing from stack"
            exit 1
          fi

          echo "=== 3. S3 buckets ==="
          aws s3api head-bucket --bucket "$WEBSITE_BUCKET" --region "$REGION" && echo "Website bucket exists: $WEBSITE_BUCKET"
          aws s3api head-bucket --bucket "$DATA_BUCKET" --region "$REGION" && echo "Data bucket exists: $DATA_BUCKET"

          echo "=== 4. Lambda (meal-plan function) ==="
          LAMBDA_FUNCTIONS=$(aws cloudformation describe-stack-resources --stack-name "$STACK" --region "$REGION" --query "StackResources[?ResourceType=='AWS::Lambda::Function'].PhysicalResourceId" --output text)
          if [[ -z "$LAMBDA_FUNCTIONS" ]]; then
            echo "No Lambda function found in stack"
            exit 1
          fi
          MEAL_PLAN_LAMBDA=""
          for fn in $LAMBDA_FUNCTIONS; do
            if [[ "$fn" == *"MealPlanFunction"* ]]; then
              MEAL_PLAN_LAMBDA="$fn"
              break
            fi
          done
          if [[ -z "$MEAL_PLAN_LAMBDA" ]]; then
            echo "Meal plan Lambda not found. Lambda resources in stack:"
            printf '%s\n' $LAMBDA_FUNCTIONS
            exit 1
          fi
          aws lambda get-function --function-name "$MEAL_PLAN_LAMBDA" --region "$REGION" --query 'Configuration.{FunctionName:FunctionName,Runtime:Runtime}' --output table
          echo "Meal plan Lambda exists: $MEAL_PLAN_LAMBDA"

          echo "=== 5. API Gateway (REST API and POST /generate-meal-plan) ==="
          API_ID=$(aws cloudformation describe-stack-resources --stack-name "$STACK" --region "$REGION" --query "StackResources[?ResourceType=='AWS::ApiGateway::RestApi'].PhysicalResourceId" --output text)
          if [[ -z "$API_ID" ]]; then
            echo "No API Gateway REST API found in stack"
            exit 1
          fi
          aws apigateway get-rest-api --rest-api-id "$API_ID" --region "$REGION" --query '{Name:name,Id:id}' --output table
          echo "API Gateway REST API exists: $API_ID"

          echo "=== 6. Bedrock Knowledge Base ==="
          aws bedrock-agent get-knowledge-base --knowledge-base-id "$KB_ID" --region "$REGION" \
            --query '{Name:knowledgeBase.name,Status:knowledgeBase.status,Id:knowledgeBase.knowledgeBaseId}' --output table
          LAMBDA_ENV_KB=$(aws lambda get-function-configuration --function-name "$MEAL_PLAN_LAMBDA" --region "$REGION" \
            --query "Environment.Variables.KNOWLEDGE_BASE_ID" --output text)
          if [[ "$LAMBDA_ENV_KB" != "$KB_ID" ]]; then
            echo "Lambda KNOWLEDGE_BASE_ID ($LAMBDA_ENV_KB) does not match stack output ($KB_ID)"
            exit 1
          fi
          echo "Knowledge Base wired to Lambda: $KB_ID"
          echo "All AWS resources verified successfully."
